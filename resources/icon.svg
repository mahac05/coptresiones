<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient: deep purple → vibrant blue -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3CE1"/>
      <stop offset="50%" style="stop-color:#4A6CF7"/>
      <stop offset="100%" style="stop-color:#2CCFFD"/>
    </linearGradient>
    <!-- Glow gradient for play button -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- Inner shadow for depth -->
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="2"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feFlood flood-color="white" flood-opacity="0.15"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Subtle shine overlay -->
  <rect x="16" y="16" width="480" height="240" rx="96" ry="96" fill="url(#glow)" opacity="0.5"/>

  <!-- Film strip notches — left side -->
  <g fill="rgba(255,255,255,0.2)">
    <rect x="56" y="100" width="24" height="18" rx="4"/>
    <rect x="56" y="140" width="24" height="18" rx="4"/>
    <rect x="56" y="180" width="24" height="18" rx="4"/>
    <rect x="56" y="220" width="24" height="18" rx="4"/>
    <rect x="56" y="260" width="24" height="18" rx="4"/>
    <rect x="56" y="300" width="24" height="18" rx="4"/>
    <rect x="56" y="340" width="24" height="18" rx="4"/>
    <rect x="56" y="380" width="24" height="18" rx="4"/>
  </g>

  <!-- Film strip notches — right side -->
  <g fill="rgba(255,255,255,0.2)">
    <rect x="432" y="100" width="24" height="18" rx="4"/>
    <rect x="432" y="140" width="24" height="18" rx="4"/>
    <rect x="432" y="180" width="24" height="18" rx="4"/>
    <rect x="432" y="220" width="24" height="18" rx="4"/>
    <rect x="432" y="260" width="24" height="18" rx="4"/>
    <rect x="432" y="300" width="24" height="18" rx="4"/>
    <rect x="432" y="340" width="24" height="18" rx="4"/>
    <rect x="432" y="380" width="24" height="18" rx="4"/>
  </g>

  <!-- Central circle (play button container) -->
  <circle cx="256" cy="240" r="90" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  
  <!-- Play triangle -->
  <polygon points="232,192 232,288 312,240" fill="white" opacity="0.95"/>

  <!-- Compression arrows at the bottom -->
  <!-- Left arrow pointing right (→) -->
  <g transform="translate(160, 380)" fill="white" opacity="0.85">
    <!-- Arrow body -->
    <rect x="0" y="10" width="50" height="12" rx="6"/>
    <!-- Arrow head -->
    <polygon points="45,4 45,28 68,16"/>
  </g>
  
  <!-- Right arrow pointing left (←) -->
  <g transform="translate(284, 380)" fill="white" opacity="0.85">
    <!-- Arrow body -->
    <rect x="18" y="10" width="50" height="12" rx="6"/>
    <!-- Arrow head -->
    <polygon points="23,4 23,28 0,16"/>
  </g>

  <!-- Small sparkle / quality star -->
  <g transform="translate(370, 130)" fill="white" opacity="0.7">
    <polygon points="0,-14 4,-4 14,-4 6,2 9,14 0,7 -9,14 -6,2 -14,-4 -4,-4"/>
  </g>
</svg>
